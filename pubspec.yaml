name: foam_shop_register
description: "Foam Shop - Digital Register"
publish_to: 'none'
version: 1.5.3+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  firebase_crashlytics: ^5.2.6
  firebase_performance: ^0.11.4+5
  fl_chart: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.14.3
  intl: ^0.20.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.0
  shared_preferences: ^2.3.3
  csv: ^6.0.0
  excel: ^4.0.6
  http: ^1.6.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  permission_handler: ^11.3.0
  flutter_local_notifications: ^18.0.1

dependency_overrides:
  # path_provider_android 2.3.x pulls in the `jni` package, whose Android module
  # requires a native CMake/NDK build that fails on this machine with
  # "Cannot query the value of this provider because it has no value available".
  # 2.2.12 is the last release before that dependency and is already cached
  # locally, so this resolves offline and drops the jni native module entirely.
  path_provider_android: 2.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the on-device end-to-end test that generates each report file for
  # real, then reopens and parses it. This is the only way to cover the part the
  # unit tests cannot: `path_provider` needs a live platform channel, and
  # `integration_test` is what supplies one when run with
  # `flutter test integration_test -d <device>`.
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  # Was "foam-shop-icon-preview.png", which is not in the repository — the
  # tool would fail with a file-not-found on every icon regeneration.
  # assets/logo.png is the 512x512 master the launcher icons are cut from.
  image_path: "assets/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/fonts/
