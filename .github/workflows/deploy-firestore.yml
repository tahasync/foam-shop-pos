name: Deploy Firestore Rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Firestore rules test dependencies
        run: npm ci --prefix scripts

      - name: Require Firebase CI token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Add the FIREBASE_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.2

      - name: Test Firestore security rules in the emulator
        run: >-
          firebase emulators:exec --config firebase.json --only firestore
          --project foam-shop-rules-verify
          "node scripts/firestore_rules_test.mjs"

      - name: Deploy Firestore security rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --project foam-shop-register --non-interactive
