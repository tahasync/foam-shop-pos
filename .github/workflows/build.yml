name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    # Setup action major versions, current as of 2026-09-28:
    #   actions/checkout            v5   (Node 24)
    #   actions/setup-java          v5   (Node 24)
    #   actions/upload-artifact     v5   (Node 24)
    #   softprops/action-gh-release v3   (Node 24)
    # All four were bumped off the Node 20 runtime, which GitHub has
    # deprecated. These were runtime-only migrations: no input this workflow
    # uses was renamed or removed. Re-check the major tags when bumping.
    runs-on: ubuntu-latest
    # NOTE: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19. When that happens,
    # re-run a build and confirm the Android SDK / JDK toolchain still resolves
    # before trusting a release built on the new image. Pin to `ubuntu-24.04`
    # if it does not.

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned deliberately, for reproducible builds.
          #
          # `pubspec.lock` is committed so dependency resolution is fixed, but
          # the *toolchain* also affects the output: a different Flutter release
          # can change engine/asset behaviour, so "whatever stable is today"
          # would make the same tag produce a different APK on different days.
          #
          # Bump this only as a deliberate, reviewed change — and bump
          # `pubspec.yaml`'s `environment.sdk` in the same commit if the bump
          # moves the minimum supported Dart version.
          #
          # A developer machine on a newer patch (e.g. 3.44.9) is fine: the
          # project is expected to analyze and test clean on the current stable
          # release, and CI remains the authority on what is published.
          flutter-version: '3.44.8'
          architecture: x64
          cache: true

      - name: Decode Firebase google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          echo "::notice ::Package names in google-services.json:"
          grep -o '"package_name"[[:space:]]*:[[:space:]]*"[^"]*"' android/app/google-services.json || echo "  (no android client entries found)"

      - name: Write Firebase dart-define config
        run: |
          mkdir -p env
          printf '%s' '${{ secrets.FIREBASE_CONFIG_JSON_BASE64 }}' | base64 --decode > env/firebase_config.json
          file env/firebase_config.json
          wc -c < env/firebase_config.json

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "::notice ::Keystore decoded ($(wc -c < android/app/release.keystore) bytes)"

      - name: Validate google-services.json matches applicationId
        run: |
          APP_ID="com.asif.foamshop"
          if grep -q "\"$APP_ID\"" android/app/google-services.json; then
            echo "::notice ::google-services.json contains client for $APP_ID — OK"
          else
            echo "::error ::google-services.json has NO client for $APP_ID — update GOOGLE_SERVICES_JSON secret"
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          # `flutter pub get` above is REQUIRED before this check, not just for
          # the build. `dart format` picks the code style from the project's
          # *language version*, which it reads from
          # `.dart_tool/package_config.json` — not from `pubspec.yaml`. With no
          # such file it falls back to the SDK's default language version and
          # formats in the Dart 3.7 "tall" style, while this project declares
          # `sdk: ">=3.4.0"`, i.e. the short style. The result is a check that
          # fails on every file (72 of 94 when this was first added) purely
          # because it ran before `pub get`. Always run `flutter pub get`
          # before `dart format`, locally and in CI.
          dart format --output=none --set-exit-if-changed lib test

      - name: Run Tests
        run: |
          flutter test

      - name: Inject Version & Build Universal APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "::notice ::Building Tagged Release: $VERSION_NAME (Build: ${{ github.run_number }})"
            sed -i -E "s/^version: .*/version: ${VERSION_NAME}+${{ github.run_number }}/" pubspec.yaml
            flutter clean
            flutter pub get
            flutter build apk --release \
              --build-name="$VERSION_NAME" \
              --build-number=${{ github.run_number }} \
              --dart-define-from-file=env/firebase_config.json
          else
            echo "::notice ::Building Main Commit (Build: ${{ github.run_number }})"
            flutter clean
            flutter pub get
            flutter build apk --release \
              --build-number=${{ github.run_number }} \
              --dart-define-from-file=env/firebase_config.json
          fi
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APK to friendly versioned name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            # Fall back to the version declared in pubspec.yaml (strip any +build suffix)
            VERSION_NAME=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')
          fi
          # NOTE: no spaces in the filename — the GitHub release upload step
          # rewrites spaces to dots, which produced "Foam.Shop.Pos.v2.0.0.apk".
          APK_NAME="Foam-Shop-Pos-v${VERSION_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "::notice ::APK renamed to: $APK_NAME"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          overwrite: true

      - name: Generate Changelog from CHANGELOG.md or Commits
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Try to extract from CHANGELOG.md first (curated, user-facing text)
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v tag="## $TAG" '$0 ~ "^"tag {found=1; next} found && /^## / {exit} found' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              echo "$SECTION" > changelog.txt
              echo "::notice ::Changelog read from CHANGELOG.md for $TAG"
              wc -l < changelog.txt
              exit 0
            fi
          fi
          # Fallback: generate from commit messages between tags
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges)
          fi
          CLEAN=$(echo "$LOG" | grep -viE '^( - )?(ci:|chore:|docs:)' || true)
          if [ -z "$CLEAN" ]; then
            echo "No user-facing changes in this release" > changelog.txt
          else
            echo "$CLEAN" > changelog.txt
          fi
          echo "::notice ::Changelog generated from commits ($(wc -l < changelog.txt) lines)"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_NAME }}
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}